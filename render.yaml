# Referencia para desplegar en Render (plan gratis).
# Si usas Blueprint, este archivo ya está en la raíz del repositorio; si creas el servicio a mano, usa estos mismos valores.
services:
  - type: web
    name: despacho-express
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: node server.js
    healthCheckPath: /health
